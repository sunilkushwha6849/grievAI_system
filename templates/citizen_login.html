<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen Portal – GrievAI</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
.forgot-link{text-align:right;margin-top:-5px;margin-bottom:15px;}
.forgot-link a{color:#FFD966;font-size:13px;font-weight:bold;text-decoration:none;cursor:pointer;}
.modal{
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-content{
  background: #fff;
  border-radius: 20px;
  max-width: 500px;
  width: 90%;
  padding: 25px;
  position: relative;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn{
  from{transform: translateY(-50px); opacity: 0;}
  to{transform: translateY(0); opacity: 1;}
}
.modal-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #1B8A4E;
}
.modal-header h2{ color: #1B8A4E; font-size: 22px; }
.close-modal{
  background: #C0392B; color: #fff; border: none; width: 35px; height: 35px;
  border-radius: 50%; font-size: 20px; cursor: pointer;
}
.close-modal:hover{ background: #A93226; }
.form-group{margin-bottom: 18px;}
.form-label{ display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 13px; }
.form-control{
  width: 100%; padding: 10px 12px; border: 1.5px solid #E2E8F0;
  border-radius: 10px; font-size: 14px;
}
.form-control:focus{ outline: none; border-color: #1B8A4E; }
.otp-pin-input{ font-size: 32px !important; text-align: center; letter-spacing: 8px; font-weight: bold; }
.otp-buttons{ display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
.otp-buttons button{ padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-send{ background: #FFB800; color: #2c2c2c; }
.btn-verify{ background: #1B8A4E; color: #fff; }
.btn-resend{ background: #6B3FA0; color: #fff; }
.btn-close{ background: #C0392B; color: #fff; }
.otp-message{ margin-top: 15px; font-size: 14px; padding: 8px; border-radius: 8px; display: none; }
.otp-message.success{ background: #D1FAE5; color: #065F46; display: block; }
.otp-message.error{ background: #FEE2E2; color: #991B1B; display: block; }
.otp-message.info{ background: #DBEAFE; color: #1E40AF; display: block; }
.register-btn-top{
  background: #fff; color: #1B8A4E; border: none; padding: 10px 20px;
  border-radius: 50px; cursor: pointer; font-size: 14px; font-weight: bold;
}
.register-btn-top:hover{ background: #FFB800; color: #2c2c2c; transform: scale(1.02); }
.note-info{ background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-top: 15px; font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; }
</style>
</head>
<body>
<div class="login-page bg-citizen">
  <div class="login-box" style="max-width:480px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <a href="/" class="back-link" style="color:#fff;">← होम</a>
      <button class="register-btn-top" onclick="openRegisterModal()">📝 नया अकाउंट बनाएं</button>
    </div>
    <div class="login-logo">
      <div style="width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,#1B8A4E,#0E6B6B);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;">👤</div>
      <div class="big" style="color:#fff;">Citizen Portal</div>
      <div class="small" style="color:#ddd;">नागरिक पोर्टल</div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="alert-box" class="alert"></div>
        <div id="loginForm">
          <div class="form-group">
            <label class="form-label" style="color:#333;">📧 Email पता</label>
            <input type="email" id="l-email" class="form-control" placeholder="आपका Email">
          </div>
          <div class="form-group">
            <label class="form-label" style="color:#333;">🔒 पासवर्ड</label>
            <input type="password" id="l-pass" class="form-control" placeholder="पासवर्ड">
          </div>
          <div class="forgot-link">
            <a onclick="openForgotPassword()">🔑 पासवर्ड भूल गए?</a>
          </div>
          <button class="btn btn-success btn-full" onclick="doLogin()" style="background:#1B8A4E;">लॉगिन करें →</button>
        </div>
      </div>
    </div>
    <div class="note-info">⚠️ नोट: पहले Register करें, फिर Login करें</div>
  </div>
</div>

<!-- Citizen Registration Modal (OTP during registration) -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>👤 नया अकाउंट बनाएं</h2>
      <button class="close-modal" onclick="closeRegisterModal()">✕</button>
    </div>
    <form id="citizenRegisterForm">
      <div class="form-row">
        <div class="form-group"><label>पहला नाम *</label><input type="text" id="firstName" class="form-control" required></div>
        <div class="form-group"><label>अंतिम नाम *</label><input type="text" id="lastName" class="form-control" required></div>
      </div>
      <div class="form-group"><label>पूरा नाम *</label><input type="text" id="fullName" class="form-control" required></div>
      <div class="form-group"><label>शहर/जिला *</label><input type="text" id="city" class="form-control" required></div>
      <div class="form-group"><label>Gmail *</label><input type="email" id="citizenEmail" class="form-control" required></div>
      <div class="form-group"><label>मोबाइल नंबर *</label><input type="tel" id="citizenMobile" class="form-control" maxlength="10" required></div>
      <div class="form-row">
        <div class="form-group"><label>पासवर्ड *</label><input type="password" id="citizenPassword" class="form-control" required></div>
        <div class="form-group"><label>पासवर्ड दोहराएं *</label><input type="password" id="confirmPassword" class="form-control" required></div>
      </div>
      <button type="button" class="btn-submit" onclick="sendRegisterOTP()">📧 Send OTP & Register</button>
      <div id="registerOtpSection" style="display:none; margin-top:15px;">
        <div class="form-group"><label>📱 OTP कोड</label><input type="text" id="registerOtp" class="form-control" maxlength="6"></div>
        <div id="registerOtpMsg" class="otp-message"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="button" class="btn-verify" onclick="verifyRegisterOtp()">✅ Verify & Register</button>
          <button type="button" class="btn-resend" onclick="resendRegisterOtp()">🔄 Resend</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Forgot Password OTP Modal -->
<div id="forgotOtpModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🔐 पासवर्ड रीसेट</h2>
      <button class="close-modal" onclick="closeForgotModal()">✕</button>
    </div>
    <div id="forgotStep1">
      <div class="form-group"><label>📧 पंजीकृत Email</label><input type="email" id="resetEmail" class="form-control" placeholder="your@email.com"></div>
      <div class="otp-buttons">
        <button class="btn-send" onclick="sendForgotOtp()">📧 OTP भेजें</button>
        <button class="btn-close" onclick="closeForgotModal()">✖ बंद करें</button>
      </div>
    </div>
    <div id="forgotStep2" style="display:none;">
      <div class="form-group"><label>📱 OTP कोड</label><input type="text" id="forgotOtp" class="form-control otp-pin-input" maxlength="6"></div>
      <div id="forgotOtpMsg" class="otp-message"></div>
      <div class="otp-buttons">
        <button class="btn-resend" onclick="resendForgotOtp()">🔄 पुनः भेजें</button>
        <button class="btn-verify" onclick="verifyForgotOtp()">✅ OTP Verify & Reset Password</button>
        <button class="btn-close" onclick="closeForgotModal()">✖ बंद करें</button>
      </div>
    </div>
  </div>
</div>

<script>
let resetEmail = '';
let registerEmail = '', registerData = {};

function showAlert(msg,type){
  const el = document.getElementById('alert-box');
  el.className = 'alert alert-'+type+' show';
  el.innerHTML = msg;
  setTimeout(() => el.className = 'alert', 5000);
}

async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if(!email||!pass){ showAlert('Email और पासवर्ड भरें','danger'); return; }
  showAlert('⏳ Logging in...','info');
  const res = await fetch('/api/citizen/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pass})
  });
  const data = await res.json();
  if(data.success){
    localStorage.setItem('citizen',JSON.stringify(data));
    window.location='/citizen/dashboard';
  } else { showAlert(data.message,'danger'); }
}

// Register OTP
async function sendRegisterOTP(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const fullName = document.getElementById('fullName').value.trim();
  const city = document.getElementById('city').value.trim();
  const email = document.getElementById('citizenEmail').value.trim();
  const mobile = document.getElementById('citizenMobile').value.trim();
  const password = document.getElementById('citizenPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if(!firstName||!lastName||!fullName||!city||!email||!mobile||!password) { showAlert('सभी फील्ड भरें','danger'); return; }
  if(password.length<6){ showAlert('पासवर्ड 6+ कैरेक्टर','danger'); return; }
  if(password!==confirm){ showAlert('पासवर्ड मेल नहीं खाते','danger'); return; }
  if(mobile.length!==10){ showAlert('मोबाइल 10 अंक','danger'); return; }
  registerData = {name:fullName, email:email.toLowerCase(), mobile, password, city};
  registerEmail = email;
  showAlert('⏳ Sending OTP...','info');
  const res = await fetch('/api/otp/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email})
  });
  const data = await res.json();
  if(data.success){
    document.getElementById('registerOtpSection').style.display='block';
    document.getElementById('registerOtpMsg').innerHTML = `<span class="success">✅ OTP sent! DEMO: ${data.otp}</span>`;
    showAlert('OTP sent! Verify to complete registration.','success');
  } else { showAlert('❌ '+data.message,'danger'); }
}
async function resendRegisterOtp(){
  const res = await fetch('/api/otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:registerEmail})});
  const data = await res.json();
  if(data.success) document.getElementById('registerOtpMsg').innerHTML = `<span class="success">✅ OTP resent! DEMO: ${data.otp}</span>`;
  else document.getElementById('registerOtpMsg').innerHTML = `<span class="error">❌ ${data.message}</span>`;
}
async function verifyRegisterOtp(){
  const otp = document.getElementById('registerOtp').value.trim();
  if(!otp||otp.length!==6){ showAlert('6 अंक OTP दर्ज करें','danger'); return; }
  const verify = await fetch('/api/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:registerEmail,otp})});
  const vdata = await verify.json();
  if(!vdata.success){ document.getElementById('registerOtpMsg').innerHTML = `<span class="error">❌ ${vdata.message}</span>`; return; }
  const reg = await fetch('/api/citizen/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(registerData)});
  const regData = await reg.json();
  if(regData.success){
    showAlert('✅ Registration successful! Login now.','success');
    closeRegisterModal();
    document.getElementById('l-email').value = registerEmail;
  } else { showAlert('❌ '+regData.message,'danger'); }
}
function openRegisterModal(){
  document.getElementById('registerModal').style.display='flex';
  document.getElementById('citizenRegisterForm').reset();
  document.getElementById('registerOtpSection').style.display='none';
}
function closeRegisterModal(){ document.getElementById('registerModal').style.display='none'; }

// Forgot Password OTP
function openForgotPassword(){
  document.getElementById('forgotOtpModal').style.display='flex';
  document.getElementById('forgotStep1').style.display='block';
  document.getElementById('forgotStep2').style.display='none';
  document.getElementById('resetEmail').value = document.getElementById('l-email').value.trim();
}
function closeForgotModal(){ document.getElementById('forgotOtpModal').style.display='none'; }
async function sendForgotOtp(){
  const email = document.getElementById('resetEmail').value.trim();
  if(!email){ showAlert('Email दर्ज करें','danger'); return; }
  resetEmail = email;
  const msgDiv = document.getElementById('forgotOtpMsg');
  msgDiv.className = 'otp-message info';
  msgDiv.innerHTML = '⏳ Sending OTP...';
  const res = await fetch('/api/otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const data = await res.json();
  if(data.success){
    document.getElementById('forgotStep1').style.display='none';
    document.getElementById('forgotStep2').style.display='block';
    msgDiv.className = 'otp-message success';
    msgDiv.innerHTML = `✅ OTP sent! DEMO: <strong style="font-size:24px;">${data.otp}</strong>`;
  } else {
    msgDiv.className = 'otp-message error';
    msgDiv.innerHTML = '❌ '+data.message;
  }
}
async function resendForgotOtp(){
  const msgDiv = document.getElementById('forgotOtpMsg');
  msgDiv.className = 'otp-message info';
  msgDiv.innerHTML = '⏳ Resending...';
  const res = await fetch('/api/otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail})});
  const data = await res.json();
  if(data.success){
    msgDiv.className = 'otp-message success';
    msgDiv.innerHTML = `✅ OTP resent! DEMO: ${data.otp}`;
  } else {
    msgDiv.className = 'otp-message error';
    msgDiv.innerHTML = '❌ '+data.message;
  }
}
async function verifyForgotOtp(){
  const otp = document.getElementById('forgotOtp').value.trim();
  if(!otp||otp.length!==6){ document.getElementById('forgotOtpMsg').innerHTML = '<span class="error">❌ 6 अंक OTP दर्ज करें</span>'; return; }
  const verify = await fetch('/api/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,otp})});
  const vdata = await verify.json();
  if(!vdata.success){ document.getElementById('forgotOtpMsg').innerHTML = `<span class="error">❌ ${vdata.message}</span>`; return; }
  const newPass = prompt('🔐 नया पासवर्ड (6+ characters):');
  if(!newPass||newPass.length<6){ alert('पासवर्ड 6+ character'); return; }
  const reset = await fetch('/api/citizen/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,new_password:newPass})});
  const rdata = await reset.json();
  if(rdata.success){
    document.getElementById('forgotOtpMsg').innerHTML = '<span class="success">✅ Password reset! Login now.</span>';
    setTimeout(()=>{ closeForgotModal(); document.getElementById('l-pass').value=''; document.getElementById('l-email').value=resetEmail; },1500);
  } else {
    document.getElementById('forgotOtpMsg').innerHTML = `<span class="error">❌ ${rdata.message}</span>`;
  }
}

document.addEventListener('DOMContentLoaded',function(){
  if(typeof initChatbot==='function') initChatbot('guest','guest','');
});
</script>
<script src="/static/js/chatbot.js"></script>
</body>
</html>
