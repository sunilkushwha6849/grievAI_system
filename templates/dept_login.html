<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Department Login – GrievAI</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
.forgot-link{text-align:right;margin-top:-5px;margin-bottom:15px;}
.forgot-link a{color:#FFD966;font-size:13px;font-weight:bold;text-decoration:none;cursor:pointer;background:rgba(0,0,0,0.3);padding:5px 10px;border-radius:20px;display:inline-block;}
.forgot-link a:hover{background:#000;color:#FFB800;}

.modal{
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-content{
  background: #fff;
  border-radius: 20px;
  max-width: 550px;
  width: 90%;
  max-height: 90%;
  overflow-y: auto;
  padding: 25px;
  position: relative;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn{
  from{transform: translateY(-50px); opacity: 0;}
  to{transform: translateY(0); opacity: 1;}
}
.modal-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #1A4FA0;
}
.modal-header h2{
  color: #1A4FA0;
  font-size: 22px;
}
.close-modal{
  background: #C0392B;
  color: #fff;
  border: none;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.close-modal:hover{background: #A93226;}

.form-group{margin-bottom: 18px;}
.form-label{
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
  color: #333;
  font-size: 13px;
}
.form-label .required{color: #C0392B;}
.form-control{
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #E2E8F0;
  border-radius: 10px;
  font-size: 14px;
}
.form-control:focus{
  outline: none;
  border-color: #1A4FA0;
}
.form-row{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.btn-submit{
  width: 100%;
  padding: 12px;
  background: linear-gradient(90deg,#1A4FA0,#6B3FA0);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
.btn-submit:hover{opacity: 0.9;}

.register-btn-top{
  background: #fff;
  color: #1A4FA0;
  border: none;
  padding: 10px 20px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.register-btn-top:hover{
  background: #FFB800;
  color: #2c2c2c;
  transform: scale(1.02);
}

.otp-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;}
.otp-modal-content{background:#0d1f2b;border-radius:25px;max-width:500px;width:90%;padding:35px 30px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.6);border:2px solid #1A4FA0;}
.otp-modal-content h2{font-family:'Baloo 2',sans-serif;font-size:32px;color:#85B7EB;margin-bottom:15px;font-weight:800;}
.otp-modal-content p{color:#CCCCCC;font-size:16px;margin-bottom:20px;}
.otp-input{font-size:18px !important;text-align:left;letter-spacing:normal;padding:14px !important;width:100%;border:3px solid #1A4FA0;border-radius:12px;margin-bottom:15px;background:#fff;color:#000;}
.otp-pin-input{font-size:36px !important;text-align:center;letter-spacing:10px;font-weight:bold;padding:18px !important;width:100%;border:3px solid #1A4FA0;border-radius:15px;margin-bottom:25px;background:#fff;color:#000;}
.otp-buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.otp-buttons button{padding:14px 22px;font-size:17px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;transition:all 0.2s;}
.btn-send{background:#FFB800;color:#2c2c2c;}
.btn-verify{background:#1A4FA0;color:#fff;}
.btn-resend{background:#6B3FA0;color:#fff;}
.btn-close{background:#C0392B;color:#fff;}
.otp-message{margin-top:20px;font-size:15px;padding:12px;border-radius:10px;display:none;font-weight:bold;}
.otp-message.success{background:#1A4FA0;color:#fff;display:block;}
.otp-message.error{background:#C0392B;color:#fff;display:block;}
.otp-message.info{background:#6B3FA0;color:#fff;display:block;}
</style>
</head>
<body>
<div class="login-page bg-dept" style="position:relative;overflow:hidden;">
  <div style="position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,0.07);border-radius:50%;top:-80px;right:-60px;pointer-events:none;"></div>

  <div class="login-box" style="position:relative;z-index:1;max-width:480px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <a href="/" class="back-link" style="color:#fff;font-weight:bold;">← होम</a>
      <button class="register-btn-top" onclick="openRegisterModal()">📝 नया विभाग रजिस्टर करें</button>
    </div>
    <div class="login-logo">
      <div style="width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,#1A4FA0,#6B3FA0);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;">🏢</div>
      <div class="big" style="color:#fff;">Department Portal</div>
      <div class="small" style="color:#ddd;">विभाग पोर्टल</div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="alert-box" class="alert"></div>

        <div id="loginForm">
          <div class="form-group">
            <label class="form-label" style="color:#333;">📧 विभाग Email</label>
            <input type="email" id="d-email" class="form-control" placeholder="dept@grievai.com">
          </div>
          <div class="form-group">
            <label class="form-label" style="color:#333;">🔒 पासवर्ड</label>
            <input type="password" id="d-pass" class="form-control" placeholder="पासवर्ड">
          </div>
          <div class="forgot-link">
            <a onclick="openForgotPassword()">🔑 पासवर्ड भूल गए?</a>
          </div>
          <button class="btn btn-primary btn-full" onclick="doLogin()" style="background:#1A4FA0;font-size:16px;padding:12px;">विभाग लॉगिन →</button>
        </div>
      </div>
    </div>

    <div class="hint-box" style="background:rgba(0,0,0,0.4);color:#ddd;margin-top:15px;">
      <b>📋 डिफॉल्ट क्रेडेंशियल्स:</b><br>
      water@grievai.com / WaterSupply123<br>
      electricity@grievai.com / Electricity123
    </div>
  </div>
</div>

<!-- Department Registration Modal -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🏢 नया विभाग रजिस्टर करें</h2>
      <button class="close-modal" onclick="closeRegisterModal()">✕</button>
    </div>
    <form id="deptRegisterForm" onsubmit="event.preventDefault(); doFullRegister();">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">पहला नाम <span class="required">*</span></label>
          <input type="text" id="firstName" class="form-control" placeholder="पहला नाम" required>
        </div>
        <div class="form-group">
          <label class="form-label">अंतिम नाम <span class="required">*</span></label>
          <input type="text" id="lastName" class="form-control" placeholder="अंतिम नाम" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">पूरा नाम <span class="required">*</span></label>
        <input type="text" id="fullName" class="form-control" placeholder="पूरा नाम" required>
      </div>

      <div class="form-group">
        <label class="form-label">शहर / जिला <span class="required">*</span></label>
        <input type="text" id="city" class="form-control" placeholder="जैसे: भोपाल, इंदौर" required>
      </div>

      <div class="form-group">
        <label class="form-label">विभाग का नाम <span class="required">*</span></label>
        <select id="deptName" class="form-control" required>
          <option value="">-- विभाग चुनें --</option>
          <option value="Water Supply">💧 Water Supply</option>
          <option value="Electricity">⚡ Electricity</option>
          <option value="Roads & PWD">🛣️ Roads & PWD</option>
          <option value="Sanitation">🧹 Sanitation</option>
          <option value="Healthcare">🏥 Healthcare</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Gmail (विभाग Email) <span class="required">*</span></label>
        <input type="email" id="deptEmail" class="form-control" placeholder="department@gmail.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">मोबाइल नंबर <span class="required">*</span></label>
        <input type="tel" id="deptMobile" class="form-control" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10" required>
      </div>

      <div class="form-group">
        <label class="form-label">पदनाम <span class="required">*</span></label>
        <input type="text" id="designation" class="form-control" placeholder="जैसे: अधिकारी" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">पासवर्ड <span class="required">*</span></label>
          <input type="password" id="deptPassword" class="form-control" placeholder="6+ कैरेक्टर" required>
        </div>
        <div class="form-group">
          <label class="form-label">पासवर्ड दोहराएं <span class="required">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="पासवर्ड फिर लिखें" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">✅ विभाग रजिस्टर करें</button>
    </form>
  </div>
</div>

<!-- OTP MODAL -->
<div id="otpModal" class="otp-modal">
  <div class="otp-modal-content">
    <div id="step1Div">
      <h2>🔐 पासवर्ड रीसेट</h2>
      <p>अपना पंजीकृत विभाग Email दर्ज करें</p>
      <input type="email" id="resetEmailInput" class="otp-input" placeholder="department@example.com">
      <div class="otp-buttons">
        <button class="btn-send" onclick="sendOTPStep1()">📧 OTP भेजें</button>
        <button class="btn-close" onclick="closeOTPModal()">✖ बंद करें</button>
      </div>
    </div>
    <div id="step2Div" style="display:none;">
      <h2>🔐 OTP वेरिफिकेशन</h2>
      <p>📧 <span id="otpEmailDisplay" style="color:#FFB800;"></span> पर OTP भेजा गया है</p>
      <input type="text" id="otpCode" class="otp-pin-input" placeholder="______" maxlength="6">
      <div id="otpMessage" class="otp-message"></div>
      <div class="otp-buttons">
        <button class="btn-resend" onclick="resendOTP()">🔄 पुनः भेजें</button>
        <button class="btn-verify" onclick="verifyOTPAndReset()">✅ वेरिफाई करें</button>
        <button class="btn-close" onclick="closeOTPModal()">✖ बंद करें</button>
      </div>
    </div>
  </div>
</div>

<div style="position:fixed; bottom:20px; left:20px; z-index:999; display:flex; gap:12px; background:#fff; padding:10px 15px; border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
  <button onclick="window.location.href='/'" style="background:#1A4FA0; color:#fff; padding:8px 18px; border-radius:40px; border:none; cursor:pointer;">🏠 होम</button>
  <button onclick="history.back()" style="background:#6B3FA0; color:#fff; padding:8px 18px; border-radius:40px; border:none; cursor:pointer;">◀ पीछे</button>
</div>

<script>
let resetEmail = '';

function showAlert(msg,type){
  const el = document.getElementById('alert-box');
  el.className = 'alert alert-'+type+' show';
  el.textContent = msg;
  setTimeout(() => el.className = 'alert', 4000);
}

async function doLogin(){
  const email=document.getElementById('d-email').value.trim();
  const pass=document.getElementById('d-pass').value;
  if(!email||!pass){showAlert('Email और पासवर्ड भरें','danger');return;}
  const r=await fetch('/api/department/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const d=await r.json();
  if(d.success){
    localStorage.setItem('dept',JSON.stringify({dept_name:d.dept_name,officer_name:d.officer_name,email:d.email}));
    window.location='/department/dashboard';
  } else if(d.not_verified){
    showAlert(d.message,'danger');
  } else {
    showAlert(d.message,'danger');
  }
}

function openRegisterModal(){
  document.getElementById('registerModal').style.display = 'flex';
  document.getElementById('deptRegisterForm').reset();
}

function closeRegisterModal(){
  document.getElementById('registerModal').style.display = 'none';
}

async function doFullRegister(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const fullName = document.getElementById('fullName').value.trim();
  const city = document.getElementById('city').value.trim();
  const deptName = document.getElementById('deptName').value;
  const email = document.getElementById('deptEmail').value.trim();
  const mobile = document.getElementById('deptMobile').value.trim();
  const designation = document.getElementById('designation').value.trim();
  const password = document.getElementById('deptPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  
  if(!firstName){ showAlert('❌ पहला नाम भरें', 'danger'); return; }
  if(!lastName){ showAlert('❌ अंतिम नाम भरें', 'danger'); return; }
  if(!fullName){ showAlert('❌ पूरा नाम भरें', 'danger'); return; }
  if(!city){ showAlert('❌ शहर भरें', 'danger'); return; }
  if(!deptName){ showAlert('❌ विभाग चुनें', 'danger'); return; }
  if(!email){ showAlert('❌ Email भरें', 'danger'); return; }
  if(!email.includes('@')){ showAlert('❌ सही Email दें', 'danger'); return; }
  if(!mobile){ showAlert('❌ मोबाइल नंबर भरें', 'danger'); return; }
  if(mobile.length !== 10){ showAlert('❌ मोबाइल नंबर 10 अंकों का होना चाहिए', 'danger'); return; }
  if(isNaN(mobile)){ showAlert('❌ मोबाइल सिर्फ अंकों में', 'danger'); return; }
  if(!designation){ showAlert('❌ पदनाम भरें', 'danger'); return; }
  if(!password){ showAlert('❌ पासवर्ड भरें', 'danger'); return; }
  if(password.length < 6){ showAlert('❌ पासवर्ड 6+ कैरेक्टर', 'danger'); return; }
  if(password !== confirmPass){ showAlert('❌ पासवर्ड मेल नहीं खाते', 'danger'); return; }
  
  const officerName = `${fullName} (${designation})`;
  
  showAlert('⏳ रजिस्ट्रेशन हो रहा...', 'info');
  
  try {
    const r = await fetch('/api/department/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        dept_name: deptName,
        officer_name: officerName,
        email: email,
        password: password,
        mobile: mobile,
        city: city
      })
    });
    const d = await r.json();
    if(d.success){
      showAlert('✅ ' + d.message, 'success');
      closeRegisterModal();
      document.getElementById('deptRegisterForm').reset();
      document.getElementById('d-email').value = email;
      document.getElementById('d-pass').focus();
    } else {
      showAlert('❌ ' + d.message, 'danger');
    }
  } catch(error) {
    showAlert('❌ नेटवर्क त्रुटि', 'danger');
  }
}

function openForgotPassword(){
  const email = document.getElementById('d-email').value.trim();
  document.getElementById('resetEmailInput').value = email || '';
  document.getElementById('step1Div').style.display = 'block';
  document.getElementById('step2Div').style.display = 'none';
  document.getElementById('otpModal').style.display = 'flex';
}

async function sendOTPStep1(){
  const email = document.getElementById('resetEmailInput').value.trim();
  if(!email){showAlert('❌ Email दर्ज करें','danger');closeOTPModal();return;}
  resetEmail = email;
  const msgDiv = document.getElementById('otpMessage');
  msgDiv.className = 'otp-message info';
  msgDiv.textContent = '⏳ OTP भेजा जा रहा...';
  document.getElementById('step1Div').style.display = 'none';
  document.getElementById('step2Div').style.display = 'block';
  document.getElementById('otpEmailDisplay').textContent = resetEmail;
  const r = await fetch('/api/otp/send', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:email, user_type:'department'})});
  const d = await r.json();
  if(d.success){
    msgDiv.className = 'otp-message success';
    msgDiv.innerHTML = '✅ OTP भेजा!<br>📱 DEMO OTP: <span style="font-size:28px;">'+d.otp+'</span>';
  } else {
    msgDiv.className = 'otp-message error';
    msgDiv.textContent = '❌ '+d.message;
  }
}

async function resendOTP(){
  if(!resetEmail) return;
  const msgDiv = document.getElementById('otpMessage');
  msgDiv.className = 'otp-message info';
  msgDiv.textContent = '⏳ पुनः भेजा जा रहा...';
  const r = await fetch('/api/otp/send', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:resetEmail, user_type:'department'})});
  const d = await r.json();
  if(d.success){
    msgDiv.className = 'otp-message success';
    msgDiv.innerHTML = '✅ OTP पुनः भेजा!<br>📱 DEMO OTP: '+d.otp;
  } else {
    msgDiv.className = 'otp-message error';
    msgDiv.textContent = '❌ '+d.message;
  }
}

async function verifyOTPAndReset(){
  const otp = document.getElementById('otpCode').value.trim();
  const msgDiv = document.getElementById('otpMessage');
  if(!otp || otp.length!==6){msgDiv.className='otp-message error';msgDiv.textContent='❌ 6 अंक OTP दर्ज करें';return;}
  msgDiv.className='otp-message info';msgDiv.textContent='⏳ वेरिफाई हो रहा...';
  const v=await fetch('/api/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:resetEmail,otp:otp})});
  const vd=await v.json();
  if(!vd.success){msgDiv.className='otp-message error';msgDiv.textContent='❌ '+vd.message;return;}
  const newPass=prompt('🔐 नया पासवर्ड (6+ कैरेक्टर):');
  if(!newPass || newPass.length<6){msgDiv.className='otp-message error';msgDiv.textContent='❌ पासवर्ड 6+ कैरेक्टर';return;}
  const r=await fetch('/api/department/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,new_password:newPass})});
  const rd=await r.json();
  if(rd.success){
    msgDiv.className='otp-message success';
    msgDiv.innerHTML='✅ '+rd.message+'<br>अब लॉगिन करें!';
    setTimeout(()=>{closeOTPModal();document.getElementById('d-pass').value='';document.getElementById('d-email').value=resetEmail;},2000);
  } else {
    msgDiv.className='otp-message error';
    msgDiv.textContent='❌ '+rd.message;
  }
}

function closeOTPModal(){
  document.getElementById('otpModal').style.display='none';
  document.getElementById('otpCode').value='';
  document.getElementById('step1Div').style.display='block';
  document.getElementById('step2Div').style.display='none';
  resetEmail='';
}
</script>
<script src="/static/js/chatbot.js"></script>
<script src="/static/js/chatbot.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if(typeof initChatbot === 'function') {
        initChatbot('guest', 'guest');
    }
});
</script>
</body>
</html>
